allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

// Temporary compatibility for AGP 8+: set missing namespaces on legacy Android library plugins
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            def hasNamespaceProp = androidExt.hasProperty("namespace")
            def currentNs = hasNamespaceProp ? androidExt.namespace : null
            if (!currentNs) {
                try {
                    def manifestFile = androidExt.sourceSets.main.manifest.srcFile
                    if (manifestFile != null && manifestFile.exists()) {
                        def manifest = new groovy.xml.XmlSlurper(false, false).parse(manifestFile)
                        def pkg = manifest.@package?.toString()
                        if (pkg) {
                            androidExt.namespace = pkg
                        }
                    }
                } catch (Throwable ignored) {
                    // ignore; build will surface any remaining namespace errors
                }
            }
        }
    }
}
